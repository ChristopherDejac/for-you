<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .envlope-wrapper {
            position: relative;
            z-index: 1;
            cursor: pointer;
        }

        #envelope {
            position: relative;
            width: 280px;
            height: 180px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            background-color: #d9534f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: box-shadow 0.5s ease;
        }

        .open#envelope {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .front {
            position: absolute;
            width: 0;
            height: 0;
            z-index: 3;
        }

        .flap {
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-bottom: 82px solid transparent;
            border-top: 98px solid #d9534f;
            transform-origin: top;
            pointer-events: none;
        }

        .open .flap {
            transform: rotateX(180deg);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.6s;
            z-index: 1;
        }

        .close .flap {
            transform: rotateX(0deg);
            transition: transform 0.5s 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 1s;
            z-index: 5;
        }

        .pocket {
            border-left: 140px solid #f5a3a2;
            border-right: 140px solid #f5a3a2;
            border-bottom: 90px solid #ff6f61;
            border-top: 90px solid transparent;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        .letter {
            position: relative;
            background-color: #fff;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            height: 90%;
            top: 5%;
            border-radius: 6px;
            box-shadow: 0 2px 26px rgba(0, 0, 0, 0.12);
            font-family: "Dancing Script", cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .close .letter {
            transform: translateY(0px) scale(1);
            transition: transform 0.5s ease, z-index 1s;
            z-index: 1;
        }

        .open .letter {
            transform: translateY(-110px) scale(1.08);
            transition: transform 0.5s 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.6s;
            z-index: 2;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }

        .words {
            position: absolute;
            left: 10%;
            width: 80%;
            height: auto;
            background-color: transparent;
            text-align: center;
        }

        .words.line1 {
            top: 18%;
            font-size: 0.9rem;
            font-weight: bold;
            color: #6b4c3b;
        }

        .words.line2 {
            top: 40%;
            font-size: 0.8rem;
            color: #5a4036;
        }

        .words.line3 {
            top: 56%;
            font-size: 0.8rem;
            color: #5a4036;
        }

        .words.line4 {
            top: 72%;
            font-size: 0.8rem;
            color: #5a4036;
        }

        .signoff {
            position: absolute;
            bottom: 6%;
            right: 12%;
            font-size: 0.7rem;
            color: #8a6b5a;
            font-style: italic;
        }

        .address-text {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            font-family: 'Georgia', serif;
            transition: opacity 0.3s ease;
        }

        .open .address-text {
            opacity: 0.6;
        }

        .close .address-text {
            opacity: 1;
        }

        .address-text .name {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .address-text .sub {
            font-size: 12px;
            color: #ffe6e6;
            font-style: italic;
            letter-spacing: 1px;
        }

        .hearts {
            position: absolute;
            top: 90px;
            left: 0;
            right: 0;
            z-index: 2;
        }

        .heart {
            position: absolute;
            bottom: 0;
            right: 10%;
            pointer-events: none;
        }

        .heart:before,
        .heart:after {
            position: absolute;
            content: "";
            left: 50px;
            top: 0;
            width: 50px;
            height: 80px;
            background: #e60073;
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            pointer-events: none;
        }

        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .close .heart {
            opacity: 0;
            animation: none;
        }

        .a1 {
            left: 20%;
            transform: scale(0.6);
            opacity: 1;
            animation: slideUp 4s linear 1, sideSway 2s ease-in-out 4 alternate;
            animation-fill-mode: forwards;
            animation-delay: 0.7s;
        }

        .a2 {
            left: 55%;
            transform: scale(1);
            opacity: 1;
            animation: slideUp 5s linear 1, sideSway 4s ease-in-out 2 alternate;
            animation-fill-mode: forwards;
            animation-delay: 0.7s;
        }

        .a3 {
            left: 10%;
            transform: scale(0.8);
            opacity: 1;
            animation: slideUp 7s linear 1, sideSway 2s ease-in-out 6 alternate;
            animation-fill-mode: forwards;
            animation-delay: 0.7s;
        }

        @keyframes slideUp {
            0% { top: 0; }
            100% { top: -600px; }
        }

        @keyframes sideSway {
            0% { margin-left: 0px; }
            100% { margin-left: 50px; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .envlope-wrapper {
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            transition: opacity 0.4s;
        }

        .hint.hidden { opacity: 0; }

        .bg-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-heart {
            position: absolute;
            font-size: 20px;
        }

        .bg-heart.up {
            bottom: -40px;
            animation: floatUp linear infinite;
        }

        .bg-heart.rain {
            top: -40px;
            animation: heartRain linear infinite;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        @keyframes heartRain {
            0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            10%  { opacity: 0.9; }
            80%  { opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(-180deg) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="bg-hearts"></div>

<div class="envlope-wrapper">
    <div id="envelope" class="close" onclick="if(this.classList.contains('close')){this.classList.remove('close');this.classList.add('open')}else{this.classList.remove('open');this.classList.add('close')};this.parentElement.querySelector('.hint')?.classList.toggle('hidden')">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
            <div class="words line1" style="top:12%">I'm Sorry ❤️</div>
            <div class="words line2">I know I hurt you, and I truly regret it.</div>
            <div class="words line3">You mean everything to me.</div>
            <div class="words line4">I love you so much. 🤍</div>
            <div class="signoff">— Yours always</div>
        </div>
        <div class="hearts">
            <div class="heart a1"></div>
            <div class="heart a2"></div>
            <div class="heart a3"></div>
        </div>
        <div class="address-text">
            <div class="name">For You</div>
            <div class="sub">My chichii</div>
        </div>
    </div>
    <div class="hint">✉️ click to open</div>
</div>

<script>
    const container = document.querySelector('.bg-hearts');
    const symbols = ['❤️', '💕', '💖', '💗', '💝'];

    for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'bg-heart';
        el.textContent = symbols[i % symbols.length];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (10 + Math.random() * 24) + 'px';
        el.style.opacity = 0.15 + Math.random() * 0.35;

        if (i < 30) {
            el.classList.add('up');
            el.style.animationDuration = (8 + Math.random() * 10) + 's';
            el.style.animationDelay = (Math.random() * 12) + 's';
        } else {
            el.classList.add('rain');
            el.style.animationDuration = (5 + Math.random() * 7) + 's';
            el.style.animationDelay = (Math.random() * 15) + 's';
        }

        container.appendChild(el);
    }
</script>

</body>
</html>
